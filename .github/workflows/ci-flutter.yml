name: CI - flutter_shell

on:
  pull_request:
    branches: [sanctuary]
    paths:
      - "flutter_shell/**"
      - ".github/workflows/ci-flutter.yml"

env:
  # Keep in sync with flutter_shell/*/.metadata (the version this was last
  # scaffolded/verified against locally).
  FLUTTER_VERSION: 3.44.8

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [packages/webos_webview, app]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: pub get
        working-directory: flutter_shell/${{ matrix.module }}
        run: flutter pub get

      - name: analyze
        working-directory: flutter_shell/${{ matrix.module }}
        run: flutter analyze

  android-build:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: pub get
        working-directory: flutter_shell/app
        run: flutter pub get

      # A real build, not just static analysis — GitHub-hosted ubuntu-latest
      # runners ship with the Android SDK preinstalled, which this repo's own
      # dev environment currently doesn't have. `--debug` skips signing config.
      - name: Build debug APK
        working-directory: flutter_shell/app
        run: flutter build apk --debug

  # iOS build is intentionally not run here: `webview_flutter`'s iOS support
  # is covered by `flutter analyze` above, and a real `flutter build ios`
  # needs a macOS runner, which costs meaningfully more CI minutes than
  # Linux. Add a macos-latest job here (flutter build ios --no-codesign) if
  # that verification becomes worth the cost.
