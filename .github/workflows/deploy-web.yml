name: Deploy web-os

on:
  push:
    branches: [sanctuary]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No package-lock.json is committed yet, so `cache: npm` is left off —
          # setup-node's cache step hard-fails if the lockfile it's told to hash
          # doesn't exist. Re-enable with `cache: npm` /
          # `cache-dependency-path: web/package-lock.json` once one is committed,
          # and switch the install step below to `npm ci` at the same time.

      - name: Install dependencies
        run: npm install

      - name: Build static export
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
